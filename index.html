<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Mone</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="coinStyle.css">
</head>
<body>
  <main class="tab">
  <main id="root">
    <header>
      <ul class="imgTab">
        <img id="userImage" src="#"  class="userImage"/>
        <span id="username">@set username</span>
      </ul>
      
      <ul class="headerNav">
        <li onclick="onSetting()">
          <ion-icon name="moon-outline"></ion-icon>
        </li>
        
        <li onclick="onSetting()"><ion-icon name="cog-outline"></ion-icon></li>
      </ul>
    </header>
    
    <div class="wallet">
      <p>My Balance</p>
      <span class="synbolC">&#8358; <span><span id="balance">0.00</span></span>
    </div>
    
    <ul class="sendContainer">
      <li onclick="onSend()">Deposit</li>
      
      <li onclick="onSend('Wcon')">Withdraw</li>
      
      <li onclick="onSend()">History</li>
    </ul>
    
    <article class="coinContainer">
      <div class="coin">
        <nav class="coinLeft">
        <img src="https://i.ibb.co/x86gd4Vg/USDT-Logo.png" alt="USDT-Logo" class="coinSynbol"/>
        
        <div class="coinName">
          <span>USDT</span>
          <span id="coinBalance">0.0000</span>
        </div></nav>
      
      <div class="coinPrice">
        <span>$ <span id="coinValue">0.00
        </span></span>
        
        <span id="coinPrice">$ <span id="coinPrice">0.00</span></span>
      </div>
      </div>
  </article>
  </main>
  
  
  <article onclick="onClose('')" class="w-container">
  <div class="W-con" id="Wcon">
    <div class="thead2">
      <span>Transfer</span>
    </div>
  </div>
  </article>
  
  <article class="setting" id="setting">
    
  </article>
  </main>
  
<script type="module" src="index.js"></script>
<script src="send.js"></script>
<script src="price.js"></script>


<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
